 <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#020617"/>
      <stop offset=".55" stop-color="#10133a"/>
      <stop offset="1" stop-color="#061d30"/>
    </linearGradient>
    <linearGradient id="mountain" x2="0" y2="1">
      <stop stop-color="#312e81"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <g fill="#c4f1ff">
    <circle cx="75" cy="48" r="1.5"/><circle cx="180" cy="90" r="1"/><circle cx="260" cy="34" r="1.5"/>
    <circle cx="370" cy="70" r="1"/><circle cx="490" cy="30" r="1.5"/><circle cx="580" cy="82" r="1"/>
    <circle cx="690" cy="39" r="1.5"/><circle cx="790" cy="70" r="1"/><circle cx="900" cy="32" r="1.5"/>
    <circle cx="1030" cy="70" r="1"/><circle cx="1120" cy="35" r="1.5"/>
  </g>
  <circle cx="905" cy="94" r="48" fill="#312e81" opacity=".55"/>
  <circle cx="905" cy="94" r="37" fill="#a5f3fc" opacity=".12"/>
  <path d="M0 225 L110 130 165 183 260 88 350 195 460 112 555 205 680 100 775 194 875 126 990 211 1090 125 1200 205 V320 H0Z" fill="url(#mountain)"/>
  <path d="M0 252 L135 183 230 231 370 148 470 240 600 174 720 245 850 180 975 242 1090 177 1200 235" fill="none" stroke="#4338ca" stroke-width="2" opacity=".8"/>
  <path d="M0 275 L190 235 350 265 510 220 680 269 850 230 1020 268 1200 225" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".7"/>
  <g stroke="url(#neon)" fill="none" filter="url(#glow)">
    <rect x="14" y="14" width="1172" height="292" rx="15" stroke-width="1.5" opacity=".75"/>
    <path d="M34 275 H230 L255 260 M970 45 H1125 L1145 65" stroke-width="2"/>
    <ellipse cx="1080" cy="160" rx="70" ry="95" stroke-width="1.5" opacity=".5">
      <animateTransform attributeName="transform" type="rotate" from="0 1080 160" to="360 1080 160" dur="24s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="1080" cy="160" r="55" stroke-width="1" opacity=".65">
      <animate attributeName="r" values="55;63;55" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="monospace" fill="#67e8f9">
    <text x="48" y="48" font-size="13" letter-spacing="3">ABBAS.OS // DEVOPS COMMAND CENTER</text>
    <text x="50" y="133" font-size="43" font-weight="bold" fill="#ffffff">Hi, I'm Abbas Kazmi</text>
    <text x="52" y="165" font-size="17" fill="#a5f3fc">ASPIRING DEVOPS ENGINEER</text>
    <text x="52" y="191" font-size="14" fill="#c4b5fd">CLOUD • AUTOMATION • SECURITY</text>
    <path d="M52 213 H430" stroke="#22d3ee" stroke-width="2"/>
    <text x="52" y="242" font-size="13" fill="#dbeafe">AUTOMATE  /  DEPLOY  /  SCALE  /  REPEAT</text>
    <text x="52" y="280" font-size="12" fill="#64748b">SYSTEM STATUS: BUILDING THE FUTURE_</text>
  </g>
  <g transform="translate(1040 142)" font-family="monospace" text-anchor="middle">
    <text y="0" font-size="12" fill="#67e8f9">SYSTEM</text>
    <text y="22" font-size="17" fill="#ffffff" font-weight="bold">ONLINE</text>
    <circle cx="0" cy="42" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
